# Contramarea — compila el APK de Android en la nube, sin Android Studio.
name: Compilar APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    name: Compilar APK de depuración
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar el Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Ampliar la memoria de Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      - name: Instalar las dependencias del proyecto
        run: npm install --no-audit --no-fund

      - name: Sincronizar el juego con el proyecto Android
        run: npx cap sync android

      - name: Dar permiso de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar el APK de depuración
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Comprobar que el APK contiene el juego
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "No se generó el APK"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/index.html" \
            || { echo "El APK no contiene el juego"; exit 1; }
          echo "APK correcto:"
          ls -lh "$APK"

      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: contramarea-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
