# Contramarea — compila el APK de Android en la nube, sin Android Studio.
name: Compilar APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'assets/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    name: Compilar APK de depuración
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Recuperar las carpetas del juego
        run: |
          mkdir -p src/js src/css tools assets/icons
          for f in index.html privacy.html manifest.webmanifest sw.js; do
            if [ ! -f "src/$f" ]; then cp "$f" "src/$f"; fi
          done
          for f in config save audio monetization engine render ui main; do
            if [ ! -f "src/js/$f.js" ]; then cp "$f.js" "src/js/$f.js"; fi
          done
          if [ ! -f src/css/style.css ]; then cp style.css src/css/style.css; fi
          for f in build_web.js test_engine.js; do
            if [ ! -f "tools/$f" ]; then cp "$f" "tools/$f"; fi
          done
          if [ -f icon-1024.png ]; then cp icon-*.png assets/icons/; fi
          node -e "const fs=require('fs'); const p='capacitor.config.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.webDir='build/web'; fs.writeFileSync(p,JSON.stringify(c,null,2));"
          sed -i 's#../assets/#assets/#g' src/sw.js

      - name: Comprobar que el proyecto está completo
        run: |
          falta=0
          for f in package.json capacitor.config.json src/index.html src/js/monetization.js assets/icons/icon-1024.png; do
            if [ ! -f "$f" ]; then
              echo "FALTA: $f"
              falta=1
            fi
          done
          if [ "$falta" = "1" ]; then
            echo ""
            echo "El repositorio no tiene el juego completo."
            echo "Sube a la raiz las carpetas src/, tools/ y assets/, y los"
            echo "archivos package.json y capacitor.config.json."
            exit 1
          fi
          echo "El proyecto esta completo."

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar el Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Ampliar la memoria de Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      - name: Instalar las dependencias del proyecto
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund

      - name: Verificar el motor y empaquetar el juego
        run: |
          npm test
          npm run build:web

      - name: Generar el proyecto Android si no está en el repositorio
        run: |
          if [ -d android ]; then
            echo "La carpeta android/ ya está en el repositorio. Se usa tal cual."
          else
            echo "No hay carpeta android/. Se genera con Capacitor."
            npx cap add android
          fi

      - name: Aplicar AdMob, la versión y los iconos
        run: |
          M=android/app/src/main/AndroidManifest.xml
          G=android/app/build.gradle
          R=android/app/src/main/res

          grep -q 'ads.APPLICATION_ID' "$M" || sed -i \
            's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />\n    </application>#' "$M"

          grep -q 'permission.AD_ID' "$M" || sed -i \
            's#</manifest>#    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n</manifest>#' "$M"

          sed -i 's#applicationId ".*"#applicationId "com.jessicapaninicuenca.contramarea"#' "$G"
          sed -i 's#versionCode .*#versionCode 1#' "$G"
          sed -i 's#versionName ".*"#versionName "1.0.0"#' "$G"

          if command -v convert >/dev/null 2>&1; then
            S=assets/icons/icon-1024.png
            for spec in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              D=${spec%%:*}; T=${spec#*:}; N=${T%%:*}; F=${T#*:}
              O=$R/mipmap-$D
              mkdir -p "$O"
              convert "$S" -resize ${N}x${N} "$O/ic_launcher.png"
              convert "$S" -resize ${N}x${N} -alpha set \
                \( -size ${N}x${N} xc:none -fill white \
                   -draw "circle $((N/2)),$((N/2)) $((N/2)),0" \) \
                -compose DstIn -composite "$O/ic_launcher_round.png"
              convert "$S" -resize $((F*66/100))x$((F*66/100)) -background none \
                -gravity center -extent ${F}x${F} "$O/ic_launcher_foreground.png"
            done
            mkdir -p "$R/values"
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<resources>' \
              '    <color name="ic_launcher_background">#071E26</color>' \
              '</resources>' > "$R/values/ic_launcher_background.xml"
            echo "Iconos generados en 5 densidades."
          else
            echo "Aviso: no hay ImageMagick. Se usara el icono por defecto."
          fi

          grep -q 'ads.APPLICATION_ID' "$M" \
            || { echo "ERROR: no se pudo aplicar el identificador de AdMob"; exit 1; }
          echo "Configuracion de Android aplicada."

      - name: Sincronizar el juego con el proyecto Android
        run: npx cap sync android

      - name: Dar permiso de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar el APK de depuración
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Comprobar que el APK contiene el juego
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "No se genero el APK"; exit 1; }
          unzip -Z1 "$APK" > /tmp/contramarea-apk-files.txt
          grep -q "^assets/public/index.html$" /tmp/contramarea-apk-files.txt \
            || { echo "El APK no contiene el juego"; exit 1; }
          grep -q "^assets/public/js/monetization.js$" /tmp/contramarea-apk-files.txt \
            || { echo "Falta la capa de monetizacion"; exit 1; }
          echo "APK correcto:"
          ls -lh "$APK"

      - name: Publicar el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: contramarea-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
